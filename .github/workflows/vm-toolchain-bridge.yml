name: VM Game Toolchain Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vm-toolchain-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_CLI_VERSION: 1.0.0-beta.2
  UNITY_EDITOR_VERSION: 6000.3.7f1
  UNITY_CHANGESET: 696ec25a53d1
  GODOT_VERSION: 4.7.1

jobs:
  fetch-small-tooling:
    runs-on: ubuntu-latest
    steps:
      - name: Download Unity CLI
        run: |
          set -euxo pipefail
          curl -fL --retry 5 \
            "https://public-cdn.cloud.unity3d.com/hub/prod/cli/${UNITY_CLI_VERSION}/unity-linux-x64" \
            -o unity
          chmod +x unity
          ./unity --version
          sha256sum unity | tee unity.sha256

      - name: Upload Unity CLI
        uses: actions/upload-artifact@v4
        with:
          name: unity-cli-linux-x64
          path: |
            unity
            unity.sha256
          compression-level: 0
          retention-days: 2

      - name: Download Godot
        run: |
          set -euxo pipefail
          curl -fL --retry 5 \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=${GODOT_VERSION}" \
            -o godot.zip
          unzip -l godot.zip | head -20
          sha256sum godot.zip | tee godot.sha256

      - name: Upload Godot
        uses: actions/upload-artifact@v4
        with:
          name: godot-linux-x64
          path: |
            godot.zip
            godot.sha256
          compression-level: 0
          retention-days: 2

  fetch-unity-editor:
    runs-on: ubuntu-latest
    steps:
      - name: Download Unity Editor archive
        run: |
          set -euxo pipefail
          curl -fL --retry 5 \
            "https://download.unity3d.com/download_unity/${UNITY_CHANGESET}/LinuxEditorInstaller/Unity-${UNITY_EDITOR_VERSION}.tar.xz" \
            -o UnityEditor.tar.xz
          ls -lh UnityEditor.tar.xz
          sha256sum UnityEditor.tar.xz | tee UnityEditor.sha256
          split -b 1900M -d -a 2 UnityEditor.tar.xz UnityEditor.tar.xz.part-
          ls -lh UnityEditor.tar.xz.part-*

      - name: Upload Unity Editor chunks
        uses: actions/upload-artifact@v4
        with:
          name: unity-editor-${{ env.UNITY_EDITOR_VERSION }}-linux-x64
          path: |
            UnityEditor.tar.xz.part-*
            UnityEditor.sha256
          compression-level: 0
          retention-days: 2
