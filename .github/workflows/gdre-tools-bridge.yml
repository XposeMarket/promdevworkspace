name: GDRE Tools Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gdre-tools-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Download GDRE Tools Linux
        run: |
          set -euxo pipefail
          curl -fL --retry 5 \
            https://github.com/GDRETools/gdsdecomp/releases/download/v2.6.3/GDRE_tools-v2.6.3-linux.zip \
            -o GDRE_tools-v2.6.3-linux.zip
          sha256sum GDRE_tools-v2.6.3-linux.zip > GDRE_tools-v2.6.3-linux.sha256
          unzip -l GDRE_tools-v2.6.3-linux.zip | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: gdre-tools-v2.6.3-linux
          path: |
            GDRE_tools-v2.6.3-linux.zip
            GDRE_tools-v2.6.3-linux.sha256
          compression-level: 0
          retention-days: 2
