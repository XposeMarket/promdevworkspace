name: Unity Pipeline Offline Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unity-pipeline-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Download Pipeline package
        run: |
          set -euxo pipefail
          VERSION=0.4.0-exp.1
          mkdir -p out
          curl -fL --retry 5 \
            "https://packages.unity.com/com.unity.pipeline/-/com.unity.pipeline-${VERSION}.tgz" \
            -o out/com.unity.pipeline-${VERSION}.tgz
          tar -tzf out/com.unity.pipeline-${VERSION}.tgz > out/package-contents.txt
          head -50 out/package-contents.txt
          sha256sum out/com.unity.pipeline-${VERSION}.tgz > out/com.unity.pipeline-${VERSION}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: unity-pipeline-0.4.0-exp.1
          path: out/
          compression-level: 0
          retention-days: 2
