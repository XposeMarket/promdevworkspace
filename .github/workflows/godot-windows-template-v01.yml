name: Godot Windows Template Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/godot-windows-template-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Download Godot 4.7.1 export templates and extract Windows x64
        run: |
          set -euxo pipefail
          curl -fL --retry 5 \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz' \
            -o templates.tpz
          unzip -l templates.tpz | grep -i windows | head -40 || true
          mkdir -p out
          unzip -j templates.tpz '*windows_release_x86_64.exe' -d out
          unzip -j templates.tpz '*windows_debug_x86_64.exe' -d out
          sha256sum out/* > out/SHA256SUMS
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.1-windows-x64-export-templates
          path: out/
          compression-level: 0
          retention-days: 2
